<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
<rect width="1000" height="1000" fill="#ffffff" />

<!-- 1. 將臨期 (0° ~ 24°) -->
<path d="M 100.00 500.00 A 400 400 0 0 1 134.56 337.28 L 362.96 438.98 A 150 150 0 0 0 350.00 500.00 Z" fill="#2563eb" stroke="#333" stroke-width="2" />
<text x="231.01" y="442.82" transform="rotate(-78.00 231.01 442.82)" font-family="sans-serif" fill="white" text-anchor="middle">
  <tspan x="231.01" dy="-0.3em" font-weight="bold" font-size="24">將臨期</tspan>
  <tspan x="231.01" dy="1.4em" font-weight="normal" font-size="11">聖誕節前四個主日</tspan>
</text>

<!-- 2. 聖誕期 (24° ~ 48°) -->
<path d="M 134.56 337.28 A 400 400 0 0 1 232.35 202.74 L 399.63 388.53 A 150 150 0 0 0 362.96 438.98 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="277.52" y="338.36" transform="rotate(-54.00 277.52 338.36)" font-family="sans-serif" fill="black" text-anchor="middle">
  <tspan x="277.52" dy="-0.3em" font-weight="bold" font-size="20">聖誕期</tspan>
  <tspan x="277.52" dy="1.4em" font-weight="normal" font-size="10">12/24 ~ 隔年 1/5</tspan>
</text>

<!-- 3. 主顯日 (48° ~ 53°，沿半徑放射) -->
<path d="M 232.35 202.74 A 400 400 0 0 1 259.29 180.54 L 409.73 380.20 A 150 150 0 0 0 399.63 388.53 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="325.08" y="287.80" transform="rotate(50.50 325.08 287.80)" font-family="sans-serif" font-weight="bold" font-size="11" fill="black" text-anchor="middle" dominant-baseline="central">主顯日</text>

<!-- 4. 顯現期 (53° ~ 90°) -->
<path d="M 259.29 180.54 A 400 400 0 0 1 500.00 100.00 L 500.00 350.00 A 150 150 0 0 0 409.73 380.20 Z" fill="#16a34a" stroke="#333" stroke-width="2" />
<text x="412.74" y="239.21" transform="rotate(-18.50 412.74 239.21)" font-family="sans-serif" fill="white" text-anchor="middle">
  <tspan x="412.74" dy="-0.3em" font-weight="bold" font-size="24">顯現期</tspan>
  <tspan x="412.74" dy="1.4em" font-weight="normal" font-size="11">主顯日(1/6) ~ 聖灰日</tspan>
</text>

<!-- 5. 聖灰日 (90° ~ 95°，沿半徑放射) -->
<path d="M 500.00 100.00 A 400 400 0 0 1 534.86 101.52 L 513.07 350.57 A 150 150 0 0 0 500.00 350.00 Z" fill="#7e22ce" stroke="#333" stroke-width="2" />
<text x="512.00" y="225.26" transform="rotate(-87.50 512.00 225.26)" font-family="sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" dominant-baseline="central">聖灰日</text>

<!-- 6. 預苦期 (95° ~ 131°) -->
<path d="M 534.86 101.52 A 400 400 0 0 1 762.41 198.02 L 598.40 386.76 A 150 150 0 0 0 513.07 350.57 Z" fill="#7e22ce" stroke="#333" stroke-width="2" />
<text x="607.45" y="246.86" transform="rotate(23.00 607.45 246.86)" font-family="sans-serif" fill="white" text-anchor="middle">
  <tspan x="607.45" dy="-0.7em" font-weight="bold" font-size="22">預苦期</tspan>
  <tspan x="607.45" dy="1.35em" font-weight="normal" font-size="11">復活節前推40天</tspan>
  <tspan x="607.45" dy="1.25em" font-weight="normal" font-size="10.5">(不含主日)</tspan>
</text>

<!-- 7. 聖週 (131° ~ 136°，沿半徑放射) -->
<path d="M 762.41 198.02 A 400 400 0 0 1 787.97 222.25 L 607.99 395.84 A 150 150 0 0 0 598.40 386.76 Z" fill="#dc2626" stroke="#333" stroke-width="2" />
<text x="689.30" y="300.52" transform="rotate(-46.50 689.30 300.52)" font-family="sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" dominant-baseline="central">聖週</text>

<!-- 8. 受難日 (136° ~ 141°，沿半徑放射) -->
<path d="M 787.97 222.25 A 400 400 0 0 1 810.74 248.51 L 616.53 405.69 A 150 150 0 0 0 607.99 395.84 Z" fill="#1e293b" stroke="#333" stroke-width="2" />
<text x="705.96" y="317.78" transform="rotate(-41.50 705.96 317.78)" font-family="sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" dominant-baseline="central">受難日</text>

<!-- 9. 復活節 (141° ~ 146°，沿半徑放射) -->
<path d="M 810.74 248.51 A 400 400 0 0 1 830.56 276.62 L 623.96 416.23 A 150 150 0 0 0 616.53 405.69 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="721.06" y="336.42" transform="rotate(-36.50 721.06 336.42)" font-family="sans-serif" font-weight="bold" font-size="11" fill="black" text-anchor="middle" dominant-baseline="central">復活節</text>

<!-- 10. 復活期 (146° ~ 175°) -->
<path d="M 830.56 276.62 A 400 400 0 0 1 898.48 465.14 L 649.43 486.93 A 150 150 0 0 0 623.96 416.23 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="759.23" y="408.20" transform="rotate(70.50 759.23 408.20)" font-family="sans-serif" font-weight="bold" font-size="26" fill="black" text-anchor="middle" dominant-baseline="central">復活期</text>

<!-- 11. 聖靈降臨日 (175° ~ 180°，沿半徑放射) -->
<path d="M 898.48 465.14 A 400 400 0 0 1 900.00 500.00 L 650.00 500.00 A 150 150 0 0 0 649.43 486.93 Z" fill="#dc2626" stroke="#333" stroke-width="2" />
<text x="774.74" y="488.00" transform="rotate(-2.50 774.74 488.00)" font-family="sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" dominant-baseline="central">聖靈降臨日</text>

<!-- 12. 三一主日 (180° ~ 185°，沿半徑放射) -->
<path d="M 900.00 500.00 A 400 400 0 0 1 898.48 534.86 L 649.43 513.07 A 150 150 0 0 0 650.00 500.00 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="774.74" y="512.00" transform="rotate(2.50 774.74 512.00)" font-family="sans-serif" font-weight="bold" font-size="11" fill="black" text-anchor="middle" dominant-baseline="central">三一主日</text>

<!-- 13. 聖靈降臨期 (常年期) (185° ~ 355°) -->
<path d="M 898.48 534.86 A 400 400 0 0 1 101.52 534.86 L 350.57 513.07 A 150 150 0 0 0 649.43 513.07 Z" fill="#16a34a" stroke="#333" stroke-width="2" />
<text x="500.00" y="755.00" font-family="sans-serif" font-weight="bold" font-size="28" fill="white" text-anchor="middle" dominant-baseline="central">聖靈降臨期</text>
<text x="500.00" y="792.00" font-family="sans-serif" font-weight="normal" font-size="18" fill="white" text-anchor="middle" dominant-baseline="central">(常年期)</text>

<!-- 14. 基督君王日 (355° ~ 360°，沿半徑放射) -->
<path d="M 101.52 534.86 A 400 400 0 0 1 100.00 500.00 L 350.00 500.00 A 150 150 0 0 0 350.57 513.07 Z" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="225.26" y="512.00" transform="rotate(-2.50 225.26 512.00)" font-family="sans-serif" font-weight="bold" font-size="11" fill="black" text-anchor="middle" dominant-baseline="central">基督君王日</text>

<!-- 中心圓與核心精神 -->
<circle cx="500" cy="500" r="150" fill="#ffffff" stroke="#333" stroke-width="2" />
<text x="500" y="475" font-family="sans-serif" font-weight="bold" font-size="36" fill="black" text-anchor="middle" dominant-baseline="central">教會年曆</text>
<text x="500" y="525" font-family="sans-serif" font-weight="normal" font-size="20" fill="black" text-anchor="middle" dominant-baseline="central">以基督為中心</text>

</svg>